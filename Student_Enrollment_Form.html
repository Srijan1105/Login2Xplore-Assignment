<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Enrollment Form</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://login2explore.com/jpdb/resources/js/0.0.4/jpdb-commons.js"></script>

<style>

body{
    background:#f5f5f5;
}

.container-box{
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

button{
    margin:5px;
}

</style>

</head>

<body>

<div class="container-box">

<h1 class="text-center mb-4">
Student Enrollment Form
</h1>

<form id="studentForm">

<div class="mb-3">
<label class="form-label">Roll No</label>
<input type="text" id="rollNo" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" id="fullName" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Class</label>
<input type="text" id="studentClass" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Birth Date</label>
<input type="date" id="birthDate" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Address</label>
<textarea id="address" class="form-control"></textarea>
</div>

<div class="mb-3">
<label class="form-label">Enrollment Date</label>
<input type="date" id="enrollmentDate" class="form-control">
</div>

<div class="text-center">

<button type="button" id="saveBtn" class="btn btn-success">
Save
</button>

<button type="button" id="updateBtn" class="btn btn-primary">
Update
</button>

<button type="button" id="resetBtn" class="btn btn-danger">
Reset
</button>

</div>

</form>

</div>

<script>

const connToken = "90935207|-31949243771142197|90958758";

const dbName = "SCHOOL-DB";

const relName = "STUDENT-TABLE";

const baseUrl = "http://api.login2explore.com:5577";

let recNo = "";

$("#updateBtn").hide();

function resetForm(){

    $("#studentForm")[0].reset();

    $("#saveBtn").show();

    $("#updateBtn").hide();

    $("#rollNo").focus();
}

$("#rollNo").blur(function(){

    let rollNo = $("#rollNo").val();

    if(rollNo === ""){
        return;
    }

    let getReq = createGET_BY_KEYRequest(
        connToken,
        dbName,
        relName,
        JSON.stringify({
            rollNo: rollNo
        })
    );

    jQuery.ajaxSetup({async:false});

    let result = executeCommandAtGivenBaseUrl(
        getReq,
        baseUrl,
        "/api/irl"
    );

    jQuery.ajaxSetup({async:true});

    console.log(result);

    if(result.status === 200){

        let data = JSON.parse(result.data);

        recNo = data.rec_no;

        $("#fullName").val(data.record.fullName);
        $("#studentClass").val(data.record.studentClass);
        $("#birthDate").val(data.record.birthDate);
        $("#address").val(data.record.address);
        $("#enrollmentDate").val(data.record.enrollmentDate);

        $("#saveBtn").hide();

        $("#updateBtn").show();

        alert("Record Found");
    }
});

$("#saveBtn").click(function(){

    console.log("Save Clicked");

    let jsonObj = {

        rollNo: $("#rollNo").val(),
        fullName: $("#fullName").val(),
        studentClass: $("#studentClass").val(),
        birthDate: $("#birthDate").val(),
        address: $("#address").val(),
        enrollmentDate: $("#enrollmentDate").val()
    };

    console.log(jsonObj);

    let putReq = createPUTRequest(
        connToken,
        JSON.stringify(jsonObj),
        dbName,
        relName
    );

    console.log(putReq);

    jQuery.ajaxSetup({async:false});

    let result = executeCommandAtGivenBaseUrl(
        putReq,
        baseUrl,
        "/api/iml"
    );

    jQuery.ajaxSetup({async:true});

    console.log(result);

    alert("Record Saved Successfully");

    resetForm();
});

$("#updateBtn").click(function(){

    let jsonObj = {

        rollNo: $("#rollNo").val(),
        fullName: $("#fullName").val(),
        studentClass: $("#studentClass").val(),
        birthDate: $("#birthDate").val(),
        address: $("#address").val(),
        enrollmentDate: $("#enrollmentDate").val()
    };

    let updateReq = createUPDATERecordRequest(
        connToken,
        JSON.stringify(jsonObj),
        dbName,
        relName,
        recNo
    );

    jQuery.ajaxSetup({async:false});

    let result = executeCommandAtGivenBaseUrl(
        updateReq,
        baseUrl,
        "/api/iml"
    );

    jQuery.ajaxSetup({async:true});

    console.log(result);

    alert("Record Updated Successfully");

    resetForm();
});

$("#resetBtn").click(function(){

    resetForm();
});

</script>

</body>
</html>
